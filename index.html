<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--This style element allows us to modify the background color (or various other elements) of the body.-->
    <!--Using the style, I can change the fonts for all the text in the body, but I can't change the button font.-->
    <!--Button fonts (and the appearance in general) are based on the browser, and can only be styled with CSS-->
    <style>
        body {background-color: rgb(211, 211, 211);font-family:'Courier New', Courier, monospace;font-size:larger}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World!</title>
</head>
<body>
    <button command="show-modal" commandfor="new-dialog">Hello World!</button>

    <dialog id="new-dialog">
        <p>I can now show a new popup window!<br>This window isn't limited to just text. <br>It can also include a button to close.</p>
        <button command="close" commandfor="new-dialog">Close</button>
    </dialog>
    <text><br>Above is a <b>button.</b></text>
    <text style="color:red"><br>It currently doesn't do anything!</text>

    <text style="background-color:black;color:white"><br><br>however, once I make another commit...</text>
</body>
</html>
